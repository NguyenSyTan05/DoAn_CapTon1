name: ClassBridge CI & Security Pipeline

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  secret-scan:
    name: 1. Quét lộ khóa bí mật (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  backend-verify:
    name: 2. Kiểm tra Backend Flask
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cài đặt & Kiểm tra cú pháp / Route Flask
        working-directory: backend
        env:
          DATABASE_URL: sqlite://
          SECRET_KEY: ci-verification-secret-key-at-least-32-chars
        run: |
          pip install -r requirements.txt
          python -m compileall -q app.py config.py verification_service.py routes
          python -c "import app; assert len(list(app.app.url_map.iter_rules())) >= 50"
          if [ -d "tests" ]; then pip install pytest && python -m pytest tests -q; fi

  ai-service-and-drift:
    name: 3. Kiểm tra AI Service & Drift Meter
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kiểm tra cú pháp & Drift Meter
        run: |
          python -m compileall -q ai-service/main.py ai-service/core ai-service/modules
          python ai-service/scripts/drift_meter.py

  frontend-verify:
    name: 4. Kiểm tra TypeScript & ESLint Frontend
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Chạy TypeScript & ESLint
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npx eslint src --quiet
